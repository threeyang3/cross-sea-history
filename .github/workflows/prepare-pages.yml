name: Prepare static Pages release
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: prepare-pages-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.label.name == 'prepare-pages' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ui/editorial-gallery-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run install:ci
      - name: Import and verify registered public-domain assets
        run: |
          python -m pip install Pillow
          python scripts/import-museum-images.py
          python scripts/import-museum-images.py --check
          python scripts/test-museum-metadata.py
          npm run check:reader
          npm run check:ui -- --require-local
      - name: Verify both hosting targets
        run: |
          npm run lint
          npm run build
          npm run build:pages
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/pages-smoke" --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pages-smoke/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test Pages subpath in Chromium
        env:
          PLAYWRIGHT_PREFIX: ${{ runner.temp }}/pages-smoke
        run: node scripts/smoke-pages.mjs
      - name: Preserve checked WebP files and cache together
        uses: actions/upload-artifact@v4
        with:
          name: verified-pages-images
          path: |
            public/images/museum/
            app/data/museum-local.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve static preview
        uses: actions/upload-artifact@v4
        with:
          name: static-pages-preview
          path: dist-pages/
          include-hidden-files: true
          retention-days: 7
  commit-assets:
    needs: verify
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ui/editorial-gallery-20261124' && github.event.label.name == 'prepare-pages'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-pages-images
          path: .
      - name: Recheck exact asset paths and checksums
        run: python scripts/import-museum-images.py --check
      - name: Commit generated images only (no force push)
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git add -- public/images/museum app/data/museum-local.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Localize verified museum WebP images and checksums'
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
