name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'hooks/**'
      - 'public/**'
      - 'github-pages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.pages.config.ts'
      - 'scripts/build-pages.mjs'
      - 'scripts/check-ui.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run install:ci
      - run: npm run check:reader
      - run: npm run check:ui -- --require-local
      - name: Build static project site
        env:
          PAGES_BASE_PATH: /cross-sea-history/
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages (repository must be enabled)
        uses: actions/configure-pages@v5
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@v4
